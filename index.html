<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Socket</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        button {
            width: 90%;
            max-width: 500px;
            height: 180px;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            border: 0;
            border-radius: 20px;
            background: #007aff;
            color: white;
        }
    </style>
</head>

<body>

    <button onclick="downloadFile()">DOWNLOAD SOCKET</button>

    <script>
        function downloadFile() {
            const url = "socket.ipa";

            fetch(url)
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("Could not download socket.ipa");
                    }

                    return response.blob();
                })
                .then(function(blob) {
                    const blobUrl = URL.createObjectURL(blob);

                    const link = document.createElement("a");
                    link.href = blobUrl;
                    link.download = "socket.ipa";

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setTimeout(function() {
                        URL.revokeObjectURL(blobUrl);
                    }, 1000);
                })
                .catch(function(error) {
                    alert("Download failed: " + error.message);
                });
        }
    </script>

</body>
</html>
